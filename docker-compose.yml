services:
  db:
    image: postgres:16
    container_name: snackoverflow_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snackoverflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snackoverflow}
      POSTGRES_DB: ${POSTGRES_DB:-snackoverflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snackoverflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
